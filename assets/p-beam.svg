<text x="28" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">Finds the laser aiming beam in robotic-surgery</text><text x="28" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">video across 40 in-vivo cases. Confidence-based</text><text x="28" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">pruning hit 93% on the hardest patient,</text><text x="28" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">and the full pipeline runs at 24 FPS.</text>
