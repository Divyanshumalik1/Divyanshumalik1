<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#130C2C"/><stop offset="1" stop-color="#070A16"/></linearGradient>
<linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.flick{transform-box:fill-box;transform-origin:50% 0;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.75);opacity:.85}to{transform:scaleY(1.15);opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25);opacity:.4}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-18px)}}
.comet{animation:comet 4s ease-in-out infinite}@keyframes comet{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(500px);opacity:0}}</style>
<rect x="68" y="50" width="4" height="500" rx="2" fill="url(#rail)" opacity=".35"/>
<g class="comet"><circle cx="70" cy="50" r="5" fill="#fff"/><circle cx="70" cy="50" r="12" fill="#F9A8D4" opacity=".35"/></g>
<g>
<circle cx="70" cy="62" r="20" fill="#8B5CF6" opacity=".18" class="pulse" style="animation-delay:0.0s"/>
<circle cx="70" cy="62" r="10" fill="#0B0620" stroke="#8B5CF6" stroke-width="3"/>
<circle cx="70" cy="62" r="4" fill="#8B5CF6"/>
