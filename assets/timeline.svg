<text x="146" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Apache ResilientDB (Incubating)<tspan dx="14" font-size="17" font-weight="500" fill="#EC4899">AI Software Engineer</tspan></text>
<text x="146" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">Built Nexus, a citation-grounded research assistant used across universities (~70% faster</text><text x="146" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">answers). Event-driven S3 · SQS · Textract ingestion, BM25 + HNSW hybrid search on OpenSearch,</text><text x="146" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">GPT-4.1 generation, eval-gated canary deploys on EKS, Next.js streaming UI.</text>
