<text x="146" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Amgen<tspan dx="14" font-size="17" font-weight="500" fill="#8B5CF6">AI Software Engineer II</tspan></text>
<text x="146" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">Multi-agent clinical intelligence for 2,400+ users on Azure OpenAI, OpenAI Agents SDK,</text><text x="146" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">Azure AI Search and MCP — protocol review, cohort discovery, site feasibility, evidence analysis.</text><text x="146" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">Hybrid RAG with citations · FastAPI on AKS · Databricks + Delta Lake ingestion.</text>
</g><g>
