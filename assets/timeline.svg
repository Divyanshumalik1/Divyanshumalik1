<text x="28" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1" fill="#CBD5E1">COMPLETE</text></g>
<text x="146" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">NIH Biophotonics Center · UC Davis<tspan dx="14" font-size="17" font-weight="500" fill="#22D3EE">Software Engineer — 3D &amp; Computer Vision</tspan></text>
<text x="146" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">Real-time tumor visualization for robotic surgery on a $6M NIH P41 project. YOLOv8 aiming-beam</text><text x="146" y="533" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">segmentation at 24 FPS, and a live 4D Gaussian Splatting framework that rebuilt anatomy in</text><text x="146" y="554" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B6BED0">34–60s instead of 10+ minutes. 3 research papers.</text>
</g>
