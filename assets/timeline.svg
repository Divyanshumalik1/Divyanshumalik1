<text x="89" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#EC4899">JUN 2025 — MAR 2026</text></g>
