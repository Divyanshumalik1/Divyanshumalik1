<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310">
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140D2E"/><stop offset="1" stop-color="#080B18"/></linearGradient></defs>
<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.flick{transform-box:fill-box;transform-origin:50% 0;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.75);opacity:.85}to{transform:scaleY(1.15);opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25);opacity:.4}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-18px)}}
.glowb{opacity:0;animation:gb 3s ease-in-out infinite}@keyframes gb{0%,100%{opacity:0}50%{opacity:.9}}
.bar{animation:bar 3.2s ease-in-out infinite}@keyframes bar{0%{transform:translateX(0)}50%{transform:translateX(256px)}100%{transform:translateX(0)}}</style>
